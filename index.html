<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short Options Filter</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e2dd;
  --accent:#2b5fd9; --up:#1a7f4b; --dn:#c0392b; --warn:#b26a00; --chip:#eef0f6;
  --hl:#fff6dc; --okbg:#e6f4ec; --badbg:#fbeaea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --panel:#1d1d1b; --ink:#ecebe6; --muted:#9a9993; --line:#33332f;
    --accent:#7aa2ff; --up:#4cc38a; --dn:#ff7b6b; --warn:#f0b54a; --chip:#262a35;
    --hl:#3a321c; --okbg:#173326; --badbg:#3a1c1c;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1d1d1b; --ink:#ecebe6; --muted:#9a9993; --line:#33332f;
  --accent:#7aa2ff; --up:#4cc38a; --dn:#ff7b6b; --warn:#f0b54a; --chip:#262a35;
  --hl:#3a321c; --okbg:#173326; --badbg:#3a1c1c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 20px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px}
.wrap{padding:0 20px 30px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 11px;cursor:pointer;font:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.funnel{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.funnel span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px}
.funnel b{font-variant-numeric:tabular-nums}
.funnel .arrow{border:none;background:none;color:var(--muted);padding:4px 0}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;margin-bottom:12px}
.controls fieldset{border:none;margin:0;padding:0;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.controls legend{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:0;margin-bottom:4px}
.controls label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.controls label.ck{flex-direction:row;align-items:center;gap:5px;font-size:12px;color:var(--ink)}
input[type=number],select,input[type=search]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit;width:64px}
select{width:auto}
input[type=search]{width:110px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:1250px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;background:var(--panel);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
tbody tr.main td:first-child,thead th:first-child{position:sticky;left:0;z-index:2;background:var(--panel)}
thead th:first-child{z-index:3}
tbody tr.main:hover td:first-child{background:var(--hl)}
th.sorted{color:var(--ink)}
tbody tr.main{cursor:pointer}
tbody tr.main:hover{background:var(--hl)}
td{font-variant-numeric:tabular-nums}
.tk{font-weight:650;font-size:13px}
.nm{color:var(--muted);font-size:11px;max-width:170px;overflow:hidden;text-overflow:ellipsis;display:block}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--muted)}
.chip{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;margin-right:3px;background:var(--chip)}
.chip.BIG{background:#e9ddff;color:#4b2a9a} .chip.STREAK{background:#dcecff;color:#164f99} .chip.RUN{background:#ffe7cc;color:#8a4a00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.BIG{background:#3a2d5c;color:#d4c2ff}:root:not([data-theme="light"]) .chip.STREAK{background:#1d3553;color:#b8d6ff}:root:not([data-theme="light"]) .chip.RUN{background:#4a3115;color:#ffd19c}}
.badge{display:inline-block;border-radius:4px;padding:1px 5px;font-size:11px}
.badge.warn{background:var(--badbg);color:var(--dn);font-weight:600}
.badge.info{background:var(--chip);color:var(--muted)}
.trade{text-align:left;min-width:250px}
.trade .t1{font-weight:600}
.trade .t2{color:var(--muted);font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--up)} .dot.no{background:var(--warn)}
tr.detail td{background:var(--bg);text-align:left;padding:10px 14px}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.legs table{min-width:0;font-size:12px}
.legs td,.legs th{padding:3px 6px;border-bottom:1px dashed var(--line)}
.legs th{position:static;cursor:default;background:none;text-align:left}
.kv{color:var(--muted)} .kv b{color:var(--ink);font-weight:600}
#ctl>summary{cursor:pointer;font-size:12px;color:var(--muted);margin:0 0 8px;user-select:none}
.status{font-size:12px;color:var(--muted);margin-top:4px}
.note{font-size:12px;color:var(--muted);margin:10px 2px 0;max-width:1100px}
.empty{padding:30px;text-align:center;color:var(--muted)}
svg.spark{vertical-align:middle}
@media (max-width:700px){header,.wrap{padding-left:16px;padding-right:16px}}
</style>
<script src="site.js"></script>
<style>#runLive,#runSettled{display:none}</style>
</head>
<body>
<header>
  <div>
    <h1>Short Options Filter</h1>
    <div class="sub" id="asof">loading&hellip;</div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <select id="files" title="Daily Excel files"></select>
    <button class="btn" id="dl">Download xlsx</button>
    <button class="btn" id="runLive" title="Includes today's partial bar; option quotes are 15-min delayed">Run with live bar</button>
    <button class="btn primary" id="runSettled">Run screen</button>
  </div>
</header>
<div class="wrap">
  <div class="status" id="status"></div>
  <div class="funnel" id="funnel"></div>

  <details id="ctl" open><summary>Filters &amp; option leg</summary>
  <div class="controls">
    <fieldset><legend>Big daily move</legend>
      <label>&ge; &sigma;<input type="number" step="0.1" id="big_z"></label>
      <label>&ge; %<input type="number" step="0.5" id="big_pct"></label>
    </fieldset>
    <fieldset><legend>Consecutive days</legend>
      <label>&ge; days<input type="number" step="1" id="streak_days"></label>
      <label>&ge; %<input type="number" step="0.5" id="streak_pct"></label>
    </fieldset>
    <fieldset><legend>2&ndash;3 week run</legend>
      <label>&ge; &sigma;<input type="number" step="0.1" id="run_z"></label>
      <label>&ge; %<input type="number" step="0.5" id="run_pct"></label>
    </fieldset>
    <fieldset><legend>Show</legend>
      <label class="ck"><input type="checkbox" id="f_BIG" checked>Big</label>
      <label class="ck"><input type="checkbox" id="f_STREAK" checked>Streak</label>
      <label class="ck"><input type="checkbox" id="f_RUN" checked>Run</label>
      <label>Direction<select id="dirf"><option value="0">Up &amp; down</option><option value="1">Up only</option><option value="-1">Down only</option></select></label>
      <label>Sector<select id="sector"><option value="">All</option></select></label>
      <label>Min cap $B<input type="number" step="1" id="mincap"></label>
    </fieldset>
    <fieldset><legend>Option leg</legend>
      <label>Side<select id="side"><option value="fade">Fade the move</option><option value="mom">With the move</option><option value="both">Both</option></select></label>
      <label class="ck"><input type="checkbox" id="liqOnly">Liquid strike only</label>
      <label class="ck"><input type="checkbox" id="noEarn">Hide earnings before expiry</label>
      <label>Ticker<input type="search" id="q" placeholder="filter"></label>
      <button class="btn" id="reset">Defaults</button>
    </fieldset>
  </div>
  </details>

  <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <p class="note" id="note"></p>
</div>

<script>
const SIG = '<span style="text-transform:none">&sigma;</span>';
let D = null, sortKey = 'score', sortDir = -1, open = new Set();
const $ = id => document.getElementById(id);
const TH_KEYS = ['big_z','big_pct','streak_days','streak_pct','run_z','run_pct'];

function fmt(v, d=1, plus=false){ if(v===null||v===undefined||isNaN(v)) return '&ndash;'; const s=Number(v).toFixed(d); return (plus&&v>0?'+':'')+s; }
function pct(v, d=1){ return v==null ? '&ndash;' : `<span class="${v>0?'up':v<0?'dn':''}">${fmt(v*100,d,true)}%</span>`; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mdy(iso){ if(!iso) return ''; const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const [y,mo,d]=iso.split('-'); return `${+d} ${m[+mo-1]}`; }

function th(){ const o={}; TH_KEYS.forEach(k=>o[k]=parseFloat($(k).value)); return o; }

function evaluate(s, t){
  const big = Math.abs(s.z1)>=t.big_z && Math.abs(s.ret1)*100>=t.big_pct;
  const streak = Math.abs(s.streak)>=t.streak_days && Math.abs(s.streak_ret)*100>=t.streak_pct;
  const runW = D.settings.run_windows.filter(w => Math.abs(s['run'+w+'_z'])>=t.run_z && Math.abs(s['run'+w])*100>=t.run_pct);
  const fired=[]; let score=0;
  if(big){ fired.push('BIG'); score+=Math.abs(s.z1)/t.big_z; }
  if(streak){ fired.push('STREAK'); score+=Math.abs(s.streak)/t.streak_days; }
  if(runW.length){ fired.push('RUN'); score+=Math.max(...runW.map(w=>Math.abs(s['run'+w+'_z'])))/t.run_z; }
  let d;
  if(runW.length){ const w=runW.reduce((a,b)=>Math.abs(s['run'+b+'_z'])>Math.abs(s['run'+a+'_z'])?b:a); d=s['run'+w]>0?1:-1; }
  else if(streak) d=s.streak>0?1:-1; else d=s.ret1>0?1:-1;
  return {fired, score:Math.round(score*100)/100, dir:d};
}

function spark(arr, dir){
  if(!arr||arr.length<2) return '';
  const w=70,h=20,mn=Math.min(...arr),mx=Math.max(...arr),r=(mx-mn)||1;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-1-(v-mn)/r*(h-2)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${dir>0?'var(--up)':'var(--dn)'}" stroke-width="1.4" points="${pts}"/></svg>`;
}

function legsFor(s, dir){
  const side=$('side').value, o=s.opt||{};
  const fade = dir>0 ? 'call' : 'put', mom = dir>0 ? 'put' : 'call';
  if(side==='both') return ['put','call'];
  return [side==='fade'?fade:mom];
}

function earnBefore(s){ const o=s.opt||{}; return !!(s.earn_next && o.exp && s.earn_next<=o.exp); }

function legHtml(s, k){
  const o=s.opt||{}, L=o[k];
  if(o.error) return `<span class="mut">${esc(o.error)}</span>`;
  if(!s.opt) return `<span class="mut">no chain (below prescreen)</span>`;
  if(!L) return `<span class="mut">no ${k} quote</span>`;
  const cp = k==='put'?'P':'C';
  return `<div class="t1"><span class="dot ${L.liquid?'ok':'no'}" title="${L.liquid?'liquid':'thin: OI / bid / spread'}"></span>Sell ${mdy(o.exp)} ${fmt(L.strike, L.strike%1?1:0)}${cp} <span class="mut">&Delta;${fmt(Math.abs(L.delta),2)}</span> @ ${fmt(L.mid,2)}</div>
    <div class="t2">${fmt(L.prem_pct,2)}% (${fmt(L.ann_pct,0)}% ann) &middot; ${fmt(L.otm_pct,1,true)}% OTM &middot; IV ${fmt(L.iv,0)} &middot; OI ${L.oi} &middot; spr ${L.spread_pct==null?'&ndash;':fmt(L.spread_pct,0)+'%'} &middot; ${o.dte}d${o.in_window?'':' <span class="badge warn">outside 2&ndash;3w</span>'}</div>`;
}

const COLS = [
  {k:'ticker', t:'Ticker', l:1},
  {k:'sector', t:'Sector', l:1},
  {k:'cap', t:'Cap $B'},
  {k:'close', t:'Close / 30d'},
  {k:'fired', t:'Signals', l:1, nosort:1},
  {k:'score', t:'Score'},
  {k:'ret1', t:'1D % ('+SIG+')'},
  {k:'streak', t:'Streak'},
  {k:'run10', t:'2W %'},
  {k:'run15', t:'3W % ('+SIG+')'},
  {k:'seen', t:'Flagged /10d'},
  {k:'iv30', t:'IV30 / HV20'},
  {k:'earn_next', t:'Earnings', l:1},
  {k:'trade', t:'Trade (2&ndash;3 wk)', l:1, nosort:1},
];

function sortVal(s, k){
  if(k==='iv30') return (s.opt&&s.opt.iv_hv)||0;
  if(k==='seen') return (D.seen||{})[s.ticker]||0;
  if(['ret1','streak','run10','run15'].includes(k)) return Math.abs(s[k]);
  return s[k] ?? '';
}

function render(){
  if(!D) return;
  const t=th(), dirf=+$('dirf').value, sec=$('sector').value, minc=parseFloat($('mincap').value||0)*1e9;
  const types=['BIG','STREAK','RUN'].filter(x=>$('f_'+x).checked), q=$('q').value.trim().toUpperCase();
  const below = TH_KEYS.some(k => t[k] < D.prescreen[k]);
  let rows=[];
  for(const s of D.rows){
    const e=evaluate(s,t);
    if(!e.fired.length || !e.fired.some(f=>types.includes(f))) continue;
    if(dirf && e.dir!==dirf) continue;
    if(sec && s.sector!==sec) continue;
    if(s.cap<minc) continue;
    if(q && !s.ticker.startsWith(q)) continue;
    if($('noEarn').checked && earnBefore(s)) continue;
    const r={...s, ...e};
    if($('liqOnly').checked){ const ks=legsFor(r,e.dir); if(!ks.some(k=>s.opt&&s.opt[k]&&s.opt[k].liquid)) continue; }
    rows.push(r);
  }
  rows.sort((a,b)=>{ const x=sortVal(a,sortKey), y=sortVal(b,sortKey); return (x>y?1:x<y?-1:0)*sortDir; });

  $('tbl').querySelector('thead').innerHTML = '<tr>'+COLS.map(c=>`<th class="${c.l?'l':''} ${c.k===sortKey?'sorted':''}" data-k="${c.nosort?'':c.k}">${c.t}${c.k===sortKey?(sortDir>0?' &#9650;':' &#9660;'):''}</th>`).join('')+'</tr>';
  const tb=[];
  for(const s of rows){
    const o=s.opt||{}, seen=(D.seen||{})[s.ticker]||0;
    let earn='';
    if(s.earn_next) earn += earnBefore(s) ? `<span class="badge warn" title="reports before the option expires">${mdy(s.earn_next)} before exp</span>` : `<span class="mut">${mdy(s.earn_next)}</span>`;
    if(s.earn_last) earn += ` <span class="badge info" title="just reported - the move may be the print">reported ${mdy(s.earn_last)}</span>`;
    tb.push(`<tr class="main" data-t="${s.ticker}">
      <td class="l"><span class="tk">${s.ticker}</span><span class="nm" title="${esc(s.name)}">${esc(s.name)}</span></td>
      <td class="l"><span>${esc(s.sector)}</span>${/mapped|unclass/.test(s.class_src||'')?' <span class="badge info" title="No FactSet / R1000 GICS for this name: translated from the Yahoo industry. Fix in gics_overrides.csv">mapped</span>':''}<span class="nm" title="${esc(s.industry)}">${esc(s.industry)}</span></td>
      <td>${fmt(s.cap/1e9, s.cap>=1e11?0:1)}</td>
      <td>${fmt(s.close,2)} ${spark(s.spark, s.dir)}</td>
      <td class="l">${s.fired.map(f=>`<span class="chip ${f}">${f}</span>`).join('')}<span class="${s.dir>0?'up':'dn'}">${s.dir>0?'&#9650;':'&#9660;'}</span></td>
      <td><b>${fmt(s.score,1)}</b></td>
      <td>${pct(s.ret1)} <span class="mut">(${fmt(s.z1,1,true)})</span></td>
      <td><span class="${s.streak>0?'up':'dn'}">${s.streak>0?'+':''}${s.streak}d</span> <span class="mut">${fmt(s.streak_ret*100,1,true)}%</span></td>
      <td>${pct(s.run10)}</td>
      <td>${pct(s.run15)} <span class="mut">(${fmt(s.run15_z,1,true)})</span></td>
      <td>${seen?seen:'<span class="mut">new</span>'}</td>
      <td>${o.iv30!=null?fmt(o.iv30,0):'&ndash;'} <span class="mut">/ ${fmt(s.hv20*100,0)}</span>${o.iv_hv!=null?` <span class="${o.iv_hv>=1.2?'up':o.iv_hv<0.9?'dn':'mut'}">${fmt(o.iv_hv,2)}x</span>`:''}</td>
      <td class="l">${earn||'<span class="mut">&ndash;</span>'}</td>
      <td class="trade">${legsFor(s,s.dir).map(k=>legHtml(s,k)).join('<div style="height:4px"></div>')}</td>
    </tr>`);
    if(open.has(s.ticker)) tb.push(detail(s));
  }
  $('tbl').querySelector('tbody').innerHTML = tb.join('') || `<tr><td colspan="${COLS.length}" class="empty">No names pass these thresholds.</td></tr>`;
  $('note').innerHTML = `${rows.length} names shown of ${D.rows.length} eligible. `
    + (below ? `<b>Some thresholds are looser than the prescreen</b> (option chains are only pulled for names passing ${TH_KEYS.map(k=>D.prescreen[k]).join(' / ')}), so extra names show without a strike. `:'')
    + `Fade = sell the call after an up move, the put after a down move. Strike = OTM option with |&Delta;| nearest ${D.settings.target_delta}; expiry = the most open interest with ${D.settings.dte[0]}&ndash;${D.settings.dte[1]} days to run. Green dot = OI &ge; ${D.settings.min_oi}, bid &ge; $${D.settings.min_bid}, spread &le; ${D.settings.max_spread}% of mid. Premium % is on the strike for puts and on spot for calls. Run ${SIG} = cumulative log move / (60-day daily ${SIG} &times; &radic;n). Cboe option quotes are 15-min delayed.`;
}

function detail(s){
  const o=s.opt||{};
  const leg=(k)=>{ const L=o[k]; if(!L) return `<div class="mut">no ${k}</div>`;
    return `<table><tr><th colspan="2">${k==='put'?'Put':'Call'} ${fmt(L.strike,L.strike%1?1:0)} &middot; ${o.exp}</th></tr>
      <tr><td class="l kv">Bid / ask / mid</td><td>${fmt(L.bid,2)} / ${fmt(L.ask,2)} / <b>${fmt(L.mid,2)}</b></td></tr>
      <tr><td class="l kv">Delta / IV</td><td>${fmt(L.delta,3)} / ${fmt(L.iv,1)}%</td></tr>
      <tr><td class="l kv">OTM / premium / annualised</td><td>${fmt(L.otm_pct,1,true)}% / ${fmt(L.prem_pct,2)}% / ${fmt(L.ann_pct,0)}%</td></tr>
      <tr><td class="l kv">OI / volume / spread</td><td>${L.oi} / ${L.vol} / ${L.spread_pct==null?'&ndash;':fmt(L.spread_pct,0)+'%'}</td></tr></table>`; };
  return `<tr class="detail"><td colspan="${COLS.length}">
    <div class="kv" style="margin-bottom:8px">Daily ${SIG} <b>${fmt(s.sigma*100,2)}%</b> &middot; big days (&ge;${D.thresholds?1.5:''}${SIG}) last 3 wk: <b class="up">${s.big_up} up</b> / <b class="dn">${s.big_dn} down</b> &middot; 2W ${SIG} <b>${fmt(s.run10_z,1,true)}</b> &middot; 20d $vol <b>$${fmt(s.dollar_vol/1e6,0)}M</b> &middot; ATM IV (exp) <b>${o.atm_iv??'&ndash;'}</b> &middot; expiry OI <b>${o.exp_oi??'&ndash;'}</b> &middot; classification ${esc(s.class_src)}${s.sub_industry?' / '+esc(s.sub_industry):''}<br>
    Expiries in the next 5 weeks: ${(o.expiries||[]).map(mdy).join(', ')||'&ndash;'} &middot; quotes ${esc(o.quote_utc||'')} UTC</div>
    ${o.error?`<div class="mut">${esc(o.error)}</div>`:(s.opt?`<div class="legs">${leg('put')}${leg('call')}</div>`:'<div class="mut">No chain pulled (below prescreen).</div>')}
  </td></tr>`;
}

function setDefaults(){
  TH_KEYS.forEach(k=>$(k).value=D.thresholds[k]);
  $('mincap').value = D.settings.min_cap/1e9;
}

async function load(){
  const r = await fetch('/api/latest', {cache:'no-store'}); D = await r.json();
  if(D.missing){ $('asof').textContent='No screen yet - press Run screen.'; return; }
  const mode = D.mode==='live' ? ' <span class="badge warn">LIVE bar</span>' : '';
  $('asof').innerHTML = `Closes through <b>${D.as_of}</b>${mode} &middot; run ${D.generated_et} &middot; universe: every equity on Cboe's weekly-options list (${esc(D.weeklys_source)}) &middot; ex Health Care / biotech, cap &ge; $${D.settings.min_cap/1e9}B &middot; prices ${esc(D.notes.price_source||'')}${D.notes.factset_error?' <span class="badge warn" title="'+esc(D.notes.factset_error)+'">FactSet unavailable - Yahoo used</span>':''} &middot; sectors GICS`;
  $('funnel').innerHTML = D.funnel.map(([a,b],i)=>`${i?'<span class="arrow">&rarr;</span>':''}<span>${esc(a)} <b>${b}</b></span>`).join('');
  const secs=[...new Set(D.rows.map(s=>s.sector))].sort(), cur=$('sector').value;
  $('sector').innerHTML='<option value="">All</option>'+secs.map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('');
  if(!$('big_z').value) setDefaults();
  render();
  const f = await (await fetch('/api/files')).json();
  $('files').innerHTML = f.map(x=>`<option>${esc(x)}</option>`).join('') || '<option value="">no files</option>';
}

let wasRunning=false;
async function poll(){
  try{
    const s = await (await fetch('/api/status')).json();
    const j=s.job, t=s.task||{};
    $('runSettled').disabled=$('runLive').disabled=j.running;
    let txt = j.running ? `Running (${j.mode}) since ${j.started}&hellip; ${esc((s.log||[]).slice(-1)[0]||'')}` :
      (j.finished ? `Last manual run (${j.mode}) finished ${j.finished}${j.rc?' with errors - see screen.log':''}. ` : '');
    if(t.state) txt += ` Daily task: ${esc(t.state)}${t.last?`, last ${esc(t.last)} (result ${esc(t.result)})`:''}${t.next?`, next ${esc(t.next)}`:''}.`;
    $('status').innerHTML = txt;
    if(wasRunning && !j.running) load();
    wasRunning=j.running;
  }catch(e){}
  setTimeout(poll, wasRunning?3000:20000);
}

async function run(live){
  await fetch('/api/run'+(live?'?live=1':''),{method:'POST'});
  wasRunning=true; setTimeout(poll,500);
}

document.addEventListener('input', e=>{ if(e.target.closest('.controls')) render(); });
$('reset').onclick=()=>{ setDefaults(); render(); };
$('runSettled').onclick=()=>run(false);
$('runLive').onclick=()=>run(true);
$('dl').onclick=()=>{ const f=$('files').value; if(!f) return; if(window.downloadXlsx) window.downloadXlsx(f); else location.href='/files/'+encodeURIComponent(f); };
$('tbl').addEventListener('click', e=>{
  const h=e.target.closest('th');
  if(h){ const k=h.dataset.k; if(!k) return; if(k===sortKey) sortDir=-sortDir; else { sortKey=k; sortDir=(k==='ticker'||k==='sector'||k==='earn_next')?1:-1; } render(); return; }
  const tr=e.target.closest('tr.main'); if(!tr) return;
  const t=tr.dataset.t; open.has(t)?open.delete(t):open.add(t); render();
});
if(window.innerWidth<700) $('ctl').removeAttribute('open');
load(); poll();
</script>
</body>
</html>
